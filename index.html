<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>產編比對工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 40px 16px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header { margin-bottom: 24px; }
    .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 14px; color: #888; }
    .card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #e8e8e8;
      padding: 24px;
      margin-bottom: 16px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .label { font-size: 12px; font-weight: 600; color: #555; margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 0.05em; }
    textarea {
      width: 100%; height: 200px;
      font-family: "Consolas", "Menlo", monospace;
      font-size: 13px; padding: 12px 14px;
      border: 1.5px solid #e2e8f0; border-radius: 10px;
      background: #fafafa; color: #1a1a1a;
      resize: vertical; line-height: 1.7; outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    textarea:focus { border-color: #6366f1; background: #fff; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      padding: 10px 22px; font-size: 14px; font-weight: 600;
      border-radius: 10px; cursor: pointer;
      border: 1.5px solid #e2e8f0; background: #fff; color: #444;
      transition: all 0.15s;
    }
    button:hover { background: #f5f5f5; }
    button.primary { background: #6366f1; color: #fff; border-color: #6366f1; padding: 10px 28px; }
    button.primary:hover { background: #4f46e5; border-color: #4f46e5; }
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { border-radius: 12px; padding: 18px 16px; text-align: center; }
    .stat-card.total   { background: #f8f9ff; border: 1.5px solid #e0e4ff; }
    .stat-card.found   { background: #f0fdf4; border: 1.5px solid #bbf7d0; }
    .stat-card.missing { background: #fff5f5; border: 1.5px solid #fecaca; }
    .stat-num { font-size: 32px; font-weight: 700; display: block; margin-bottom: 4px; }
    .stat-card.total   .stat-num { color: #4338CA; }
    .stat-card.found   .stat-num { color: #166534; }
    .stat-card.missing .stat-num { color: #991b1b; }
    .stat-lbl { font-size: 12px; font-weight: 500; color: #888; }
    .progress-label { font-size: 12px; color: #888; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .progress-bar-wrap { background: #e8e8e8; border-radius: 99px; height: 6px; margin-bottom: 20px; overflow: hidden; }
    .progress-bar { height: 100%; border-radius: 99px; background: #22c55e; transition: width 0.4s ease; }
    hr { border: none; border-top: 1px solid #f0f0f0; margin: 0 0 20px; }
    .section { margin-bottom: 20px; }
    .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .section-title { font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 8px; }
    .title-missing { background: #fff5f5; color: #991b1b; border: 1px solid #fecaca; }
    .title-extra   { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .title-found   { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .copy-btn { font-size: 12px; padding: 4px 12px; border-radius: 6px; cursor: pointer; border: 1px solid #e2e8f0; background: #fff; color: #555; font-weight: 500; }
    .copy-btn:hover { background: #f5f5f5; }
    .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-family: "Consolas", "Menlo", monospace; font-size: 12px; padding: 4px 12px; border-radius: 6px; font-weight: 600; border: 1px solid transparent; }
    .chip.missing { background: #fff5f5; color: #991b1b; border-color: #fecaca; }
    .chip.extra   { background: #fffbeb; color: #92400e; border-color: #fde68a; }
    .chip.found   { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
    .toast {
      position: fixed; bottom: 28px; right: 28px;
      background: #1a1a1a; color: #fff;
      font-size: 13px; font-weight: 500; padding: 11px 20px;
      border-radius: 10px; opacity: 0; transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
      .stat-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>產編比對工具</h1>
      <p>貼上應盤點清單與實際盤點結果，自動找出缺少與多餘的產編</p>
    </div>

    <div class="card">
      <div class="grid-2">
        <div>
          <span class="label">必須找的產編（應盤點清單）</span>
          <textarea id="ta-required" placeholder="每行一個產編，例如：&#10;MOBTW0006999&#10;MOBTW0007000&#10;MOBTW0007001"></textarea>
        </div>
        <div>
          <span class="label">實際找到的產編（已盤點清單）</span>
          <textarea id="ta-actual" placeholder="每行一個產編，例如：&#10;MOBTW0006999&#10;MOBTW0007000"></textarea>
        </div>
      </div>
      <div class="btn-row">
        <button class="primary" onclick="doCompare()">開始比對</button>
        <button onclick="loadSample()">載入範例</button>
        <button onclick="clearAll()">清除</button>
      </div>
    </div>

    <div class="card" id="result-card" style="display:none;">
      <div class="stat-row">
        <div class="stat-card total">
          <span class="stat-num" id="s-total">0</span>
          <div class="stat-lbl">應盤點數量</div>
        </div>
        <div class="stat-card found">
          <span class="stat-num" id="s-found">0</span>
          <div class="stat-lbl">已找到</div>
        </div>
        <div class="stat-card missing">
          <span class="stat-num" id="s-missing">0</span>
          <div class="stat-lbl">缺少未找到</div>
        </div>
      </div>
      <div class="progress-label">
        <span>盤點進度</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar" style="width:0%"></div>
      </div>
      <hr />
      <div class="section" id="sec-missing">
        <div class="section-header">
          <span class="section-title title-missing">缺少（未找到）的產編</span>
          <button class="copy-btn" onclick="copyList('missing')">複製清單</button>
        </div>
        <div class="chip-list" id="list-missing"></div>
      </div>
      <div class="section" id="sec-extra">
        <div class="section-header">
          <span class="section-title title-extra">多餘（不在清單中）的產編</span>
          <button class="copy-btn" onclick="copyList('extra')">複製清單</button>
        </div>
        <div class="chip-list" id="list-extra"></div>
      </div>
      <div class="section" id="sec-found">
        <div class="section-header">
          <span class="section-title title-found">已找到的產編</span>
          <button class="copy-btn" onclick="copyList('found')">複製清單</button>
        </div>
        <div class="chip-list" id="list-found"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">已複製到剪貼簿</div>

  <script>
    var _missing = [], _extra = [], _found = [];

    function parseIds(text) {
      return text.split(/[\n\r,，\s]+/)
        .map(function(s) { return s.trim().toUpperCase(); })
        .filter(function(s) { return s.length > 0; });
    }

    function doCompare() {
      var required = parseIds(document.getElementById('ta-required').value);
      var actual   = parseIds(document.getElementById('ta-actual').value);
      var reqSet = {}, actSet = {};
      required.forEach(function(id) { reqSet[id] = true; });
      actual.forEach(function(id)   { actSet[id] = true; });
      _missing = required.filter(function(id) { return !actSet[id]; });
      _extra   = actual.filter(function(id)   { return !reqSet[id]; });
      _found   = required.filter(function(id) { return  actSet[id]; });

      document.getElementById('s-total').textContent   = required.length;
      document.getElementById('s-found').textContent   = _found.length;
      document.getElementById('s-missing').textContent = _missing.length;

      var pct = required.length > 0 ? Math.round(_found.length / required.length * 100) : 0;
      document.getElementById('progress-pct').textContent = pct + '%';
      document.getElementById('progress-bar').style.width = pct + '%';

      renderChips('list-missing', _missing, 'missing');
      renderChips('list-extra',   _extra,   'extra');
      renderChips('list-found',   _found,   'found');

      document.getElementById('sec-missing').style.display = _missing.length ? '' : 'none';
      document.getElementById('sec-extra').style.display   = _extra.length   ? '' : 'none';
      document.getElementById('sec-found').style.display   = _found.length   ? '' : 'none';
      document.getElementById('result-card').style.display = '';
    }

    function renderChips(containerId, ids, cls) {
      var el = document.getElementById(containerId);
      el.innerHTML = ids.map(function(id) {
        return '<span class="chip ' + cls + '">' + id + '</span>';
      }).join('');
    }

    function copyList(type) {
      var map = { missing: _missing, extra: _extra, found: _found };
      var text = (map[type] || []).join('\n');
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      var toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 1800);
    }

    function clearAll() {
      document.getElementById('ta-required').value = '';
      document.getElementById('ta-actual').value   = '';
      document.getElementById('result-card').style.display = 'none';
      _missing = []; _extra = []; _found = [];
    }

    function loadSample() {
      document.getElementById('ta-required').value =
        'MOBTW0006999\nMOBTW0007000\nMOBTW0007001\nMOBTW0007002\nMOBTW0007003\n' +
        'MOBTW0007463\nMOBTW0007464\nMOBTW0007465\nMOBTW0007466\nMOBTW0007467\n' +
        'MOBTW0007468\nMOBTW0007469\nMOBTW0006710';
      document.getElementById('ta-actual').value =
        'MOBTW0006999\nMOBTW0007000\nMOBTW0007001\nMOBTW0007002\nMOBTW0007003\n' +
        'MOBTW0007463\nMOBTW0007464\nMOBTW0007465\nMOBTW0007466\nMOBTW0007467\n' +
        'MOBTW0007468';
      doCompare();
    }
  </script>
</body>
</html>
